<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050607">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="A privacy-safe RUCA Command Core interactive product preview.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; worker-src 'self'; object-src 'none'; frame-src 'none'; media-src 'none'; form-action 'none'; base-uri 'none'">
  <title>RUCA Command Core | Public Product Preview</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="assets/demo.css?v=pass22-r1">
  <link rel="stylesheet" href="assets/recruiter-mode.css?v=recruiter-r1">
</head>
<body data-route="home">
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="space-haze" aria-hidden="true"></div>

  <div class="demo-shell">
    <header class="top-rail">
      <div class="brand-lockup">
        <img src="assets/ruca-logo.png" alt="" width="44" height="44">
        <div>
          <strong>RUCA</strong>
          <span>Welcome Home.</span>
        </div>
      </div>
      <div class="rail-actions">
        <button class="icon-button" id="searchOpen" type="button" aria-label="Open Command Search" title="Command Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
        </button>
        <button class="install-button" id="installButton" type="button" hidden>INSTALL</button>
      </div>
    </header>

    <div class="truth-rail" role="status" aria-live="polite">
      <span class="demo-badge">PUBLIC PREVIEW</span>
      <span id="connectionState">PRIVACY-SAFE SAMPLE DATA</span>
      <span class="offline-state" id="offlineState">OFFLINE-CAPABLE</span>
    </div>

    <main id="appSurface" tabindex="-1" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="RUCA worlds">
      <button type="button" data-route="home" class="active" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 11 8-7 8 7v9h-6v-6h-4v6H4z"></path></svg><span>HOME</span>
      </button>
      <button type="button" data-route="play">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9h8l3 3v6l-3 2-3-3h-2l-3 3-3-2v-6z"></path><path d="M8 13h4M10 11v4M16 12v.1M18 14v.1"></path></svg><span>PLAY</span>
      </button>
      <button type="button" data-route="live">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M4 12h16M12 4c3 3 3 13 0 16M12 4c-3 3-3 13 0 16"></path></svg><span>WORLD</span>
      </button>
      <button type="button" data-route="diagnostics">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17h3l2-7 3 10 3-13 2 10h3"></path></svg><span>HEALTH</span>
      </button>
      <button type="button" data-route="control">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M10 14v6"></path></svg><span>CONTROL</span>
      </button>
    </nav>
  </div>

  <dialog id="commandDialog" class="command-dialog">
    <button class="dialog-close" type="button" data-close-dialog="commandDialog" aria-label="Close command preview">&times;</button>
    <span class="eyebrow">PRIVACY-SAFE COMMAND PREVIEW</span>
    <h2 id="commandTitle">Command</h2>
    <p id="commandRole"></p>
    <div class="demo-notice" id="commandNotice"></div>
    <button class="primary-action" id="simulateLaunch" type="button">RUN PREVIEW SEQUENCE</button>
    <div class="sequence-status" id="sequenceStatus" aria-live="polite"></div>
  </dialog>

  <dialog id="searchDialog" class="search-dialog">
    <button class="dialog-close" type="button" data-close-dialog="searchDialog" aria-label="Close Command Search">&times;</button>
    <span class="eyebrow">COMMAND SEARCH // PUBLIC PREVIEW</span>
    <h2>Find a world or command</h2>
    <label class="search-field">
      <span class="sr-only">Search demo commands and routes</span>
      <input id="searchInput" type="search" inputmode="search" autocomplete="off" placeholder="Search RUCA">
    </label>
    <div id="searchResults" class="search-results"></div>
    <div id="virtualKeyboard" class="virtual-keyboard" aria-label="RUCA virtual keyboard"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>RUCA Command Core public preview requires JavaScript for its local interactive demonstration.</noscript>
  <script src="data/demo-data.js?v=pass22-r1"></script>
  <script src="assets/showroom-actions.js?v=pass22-r2"></script>
  <script src="assets/demo.js?v=pass22-r2"></script>
  <script src="assets/recruiter-mode.js?v=recruiter-r1"></script>
</body>
</html>
