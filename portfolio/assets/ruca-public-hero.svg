<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">RUCA Mobile Presentation Hub</title>
  <desc id="desc">A privacy-safe RUCA presentation graphic with a dark starfield, concentric system rings, and gold interface accents.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="70%">
      <stop offset="0" stop-color="#2b2115"/>
      <stop offset="0.45" stop-color="#11100f"/>
      <stop offset="1" stop-color="#050608"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#8e6b24"/>
      <stop offset="0.5" stop-color="#f2c95f"/>
      <stop offset="1" stop-color="#8e6b24"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <g fill="#d9b45d" opacity="0.42">
    <circle cx="145" cy="125" r="2"/><circle cx="312" cy="214" r="1.5"/><circle cx="514" cy="98" r="2"/>
    <circle cx="722" cy="168" r="1.5"/><circle cx="938" cy="84" r="2"/><circle cx="1140" cy="192" r="1.5"/>
    <circle cx="1350" cy="108" r="2"/><circle cx="1598" cy="225" r="1.5"/><circle cx="1776" cy="102" r="2"/>
    <circle cx="218" cy="858" r="1.5"/><circle cx="460" cy="942" r="2"/><circle cx="702" cy="812" r="1.5"/>
    <circle cx="980" cy="930" r="2"/><circle cx="1262" cy="838" r="1.5"/><circle cx="1538" cy="932" r="2"/>
    <circle cx="1764" cy="814" r="1.5"/>
  </g>
  <g transform="translate(960 520)" fill="none" stroke="url(#gold)" filter="url(#glow)">
    <circle r="310" stroke-width="3" opacity="0.55"/>
    <circle r="250" stroke-width="3" opacity="0.7"/>
    <circle r="190" stroke-width="3" opacity="0.9"/>
    <circle r="128" stroke-width="4"/>
    <g stroke-width="4" opacity="0.75">
      <path d="M0-410V-190"/><path d="M355-205L165-95"/><path d="M355 205L165 95"/>
      <path d="M0 410V190"/><path d="M-355 205L-165 95"/><path d="M-355-205L-165-95"/>
    </g>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="960" y="500" fill="#f5e9c7" font-size="128" font-weight="700" letter-spacing="18">RUCA</text>
    <text x="960" y="585" fill="#efc75d" font-size="36" letter-spacing="8">WELCOME HOME</text>
    <text x="960" y="960" fill="#d5d6d8" font-size="24" letter-spacing="4">SYSTEM AWARENESS  •  COMMAND ACCESS  •  RESPONSIVE INTERACTION</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#d5d6d8" font-size="22" letter-spacing="3">
    <text x="88" y="82">MOBILE PRESENTATION HUB</text>
    <text x="1832" y="82" text-anchor="end">PUBLIC SHOWCASE // SAFE DEMO</text>
  </g>
</svg>
